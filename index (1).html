<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Word Kit · School Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#1f4d3a; --chalk-2:#2a6049; --chalk-ink:#eaf3ec;
  --paper:#fffdf6; --line:#d9e6f2; --margin:#f2a7a7;
  --ink:#1d2433; --muted:#5b6475;
  --pencil:#f6c343; --pencil-d:#d9a21b;
  --ok:#2f9e5b; --ok-bg:#e3f5ea; --bad:#d64545; --bad-bg:#fbe6e6;
  --blue:#2f6fdc; --card:#ffffff; --shadow:0 2px 0 rgba(29,36,51,.12), 0 8px 24px rgba(29,36,51,.08);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Nunito,system-ui,sans-serif; color:var(--ink);
  background:var(--paper);
  background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
    repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px);
  min-height:100vh;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ar{font-family:"Noto Naskh Arabic",serif;direction:rtl}

/* Header */
header{background:var(--chalk);color:var(--chalk-ink);padding:18px 20px 22px;position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.05),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.04),transparent 45%);
  border-bottom:10px solid #8a5a2b}
.hwrap{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{flex:1;min-width:220px}
.kit{font-family:"Patrick Hand",cursive;font-size:18px;opacity:.8;letter-spacing:.5px}
h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(30px,6vw,44px);margin:0;line-height:1}
h1 span{color:var(--pencil)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.langsw{display:flex;background:rgba(0,0,0,.2);border-radius:999px;padding:3px}
.langsw button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--chalk-ink)}
.langsw button[aria-pressed="true"]{background:var(--pencil);color:var(--ink)}

main{max-width:960px;margin:0 auto;padding:18px 16px 60px 60px}
@media (max-width:600px){main{padding-left:16px} body{background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px)}}

/* Units */
.sec-t{font-family:"Patrick Hand",cursive;font-size:22px;color:var(--muted);margin:6px 0 8px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.unit{background:var(--card);border:2px solid #e3e7ee;border-radius:14px;padding:10px 10px 12px;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.unit:hover{transform:translateY(-2px)}
.unit[aria-pressed="true"]{border-color:var(--chalk);background:#f1f8f3}
.unit .e{font-size:28px;line-height:1}
.unit .n{font-family:Fredoka;font-weight:600;font-size:16px;margin-top:6px}
.unit .c{font-size:12px;color:var(--muted);font-weight:700}
.bar{height:6px;background:#edf0f4;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}

/* Modes */
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}
.mode{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--card);border:2px solid #e3e7ee;font-weight:800;box-shadow:var(--shadow)}
.mode[aria-pressed="true"]{background:var(--pencil);border-color:var(--pencil-d)}

/* Stage */
.stage{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:2px solid #e3e7ee;padding:22px;min-height:380px;position:relative}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.counter{font-weight:800;color:var(--muted)}
.ghost{padding:8px 12px;border-radius:10px;font-weight:700;color:var(--muted);border:2px solid #e3e7ee;background:#fff}
.ghost:hover{border-color:#c9d0db}

/* Flashcard */
.flip{perspective:1200px;max-width:440px;margin:0 auto}
.card{position:relative;height:340px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.front{background:linear-gradient(180deg,#fff,#f7fbff);border:3px solid var(--line)}
.back{background:var(--chalk);color:var(--chalk-ink);transform:rotateY(180deg)}
.big-e{font-size:96px;line-height:1.05}
.word{font-family:Fredoka;font-weight:700;font-size:34px;margin-top:10px}
.tr{font-size:26px;font-weight:800;color:var(--pencil);margin:6px 0}
.ex{font-size:17px;line-height:1.45;max-width:340px}
.ex b{color:var(--pencil)}
.tap{position:absolute;bottom:10px;font-size:12px;color:var(--muted);font-weight:700}
.back .tap{color:rgba(234,243,236,.7)}
.spk{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #1d4fa8}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 #1d4fa8}
.spk.big{width:84px;height:84px;font-size:38px}
.fc-ctrl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:12px;font-weight:800;background:var(--chalk);color:#fff;box-shadow:0 3px 0 #123326}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #123326}
.btn.y{background:var(--pencil);color:var(--ink);box-shadow:0 3px 0 var(--pencil-d)}
.btn.known{background:var(--ok);box-shadow:0 3px 0 #1f6e3f}

.pic{display:block;margin:0 auto;border-radius:14px;object-fit:cover}
.pic.lg{width:170px;height:170px;box-shadow:0 2px 10px rgba(29,36,51,.12)}
.pic.sm{width:44px;height:44px;border-radius:8px}
.pic.xs{display:inline-block;width:22px;height:22px;border-radius:4px;vertical-align:-5px}
.flip .face.front .big-e{line-height:1}
/* Quiz */
.prompt{text-align:center;margin:6px 0 18px}
.prompt .big-e{font-size:84px}
.prompt .hint{color:var(--muted);font-weight:700;margin-top:6px;font-size:16px}
.sentence{font-size:22px;font-weight:700;line-height:1.5;max-width:560px;margin:0 auto}
.gap{display:inline-block;min-width:110px;border-bottom:3px dashed var(--blue);color:var(--blue)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{padding:14px;border-radius:14px;border:2px solid #dfe4ec;background:#fff;font-family:Fredoka;font-weight:600;font-size:19px;box-shadow:0 3px 0 #dfe4ec;transition:background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{text-align:center;min-height:28px;margin-top:14px;font-weight:800;font-size:17px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.next-row{display:flex;justify-content:center;margin-top:10px}
.spell{display:flex;gap:8px;max-width:440px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.spell input{flex:1;min-width:200px;font:600 22px Fredoka;padding:12px 14px;border-radius:12px;border:2px solid #dfe4ec;text-align:center}
.spell input.ok{border-color:var(--ok);background:var(--ok-bg)}
.spell input.bad{border-color:var(--bad);background:var(--bad-bg)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.opt.bad{animation:shake .4s}
.progress{height:8px;background:#edf0f4;border-radius:9px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--pencil);transition:width .3s}

/* Results */
.res{text-align:center;padding:10px}
.res .score{font-family:Fredoka;font-size:56px;font-weight:700;color:var(--chalk)}
.stars{font-size:40px;letter-spacing:4px}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chip{background:var(--bad-bg);border:1px solid #f1c3c3;border-radius:999px;padding:6px 12px;font-weight:700}

/* Word list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.li{display:flex;align-items:center;gap:10px;border:2px solid #edf0f4;border-radius:12px;padding:10px}
.li .e{font-size:30px}
.li .w{font-family:Fredoka;font-weight:600;font-size:17px}
.li .t{color:var(--muted);font-weight:700;font-size:14px}
.li .spk{width:34px;height:34px;font-size:15px;margin-left:auto;flex:none}
.li.k{background:#f1f8f3;border-color:#cfe9d8}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--muted);font-family:"Patrick Hand";font-size:17px;margin-top:22px}

/* ===== Front page redesign ===== */
header.hero{padding:0;position:relative;border-bottom:10px solid #8a5a2b;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 20%,rgba(255,255,255,.07),transparent 45%),radial-gradient(ellipse at 85% 80%,rgba(255,255,255,.05),transparent 50%)}
.hero .langsw{position:absolute;top:14px;right:16px;z-index:3}
.hero-in{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:46px 22px 64px;position:relative;z-index:1}
.hero .kit{font-size:20px}
.hero h1{font-size:clamp(46px,8vw,76px);margin-top:4px}
.tag{font-size:19px;line-height:1.45;opacity:.92;max-width:430px;margin:14px 0 16px}
.tag b{color:var(--pencil)}
.cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn.big{font-size:18px;padding:14px 24px}
.btn.line{background:transparent;border:2px solid rgba(255,255,255,.55);box-shadow:none;color:#fff;padding:12px 20px}
.btn.line:hover{background:rgba(255,255,255,.1)}
.collage{position:relative;height:360px}
.polar{position:absolute;width:47%;background:#fff;padding:9px 9px 38px;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:transform .3s,z-index 0s}
.polar img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px}
.polar span{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-family:"Patrick Hand",cursive;font-size:22px;color:var(--ink)}
.polar::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(246,195,67,.75);border-radius:2px}
.polar:hover{transform:rotate(0) scale(1.05)!important;z-index:9}
.polar.p1{left:0;top:2%;transform:rotate(-7deg)}
.polar.p2{right:2%;top:-2%;transform:rotate(5deg);z-index:2}
.polar.p3{left:10%;bottom:-4%;transform:rotate(4deg);z-index:3}
.polar.p4{right:0;bottom:0;transform:rotate(-5deg);z-index:4}
@media (max-width:760px){
  .hero-in{grid-template-columns:1fr;padding:58px 18px 60px;gap:18px}
  .collage{height:320px;max-width:420px;margin:10px auto 0;width:100%}
}

main{padding-top:0}
.wotd{display:flex;gap:18px;align-items:center;background:#fff;border:2px solid #e3e7ee;border-radius:22px;box-shadow:0 10px 30px rgba(29,36,51,.12);
  padding:14px 18px 14px 14px;margin:-38px 0 26px;position:relative;z-index:2;flex-wrap:wrap}
.crop{width:120px;height:120px;border-radius:16px;overflow:hidden;flex:none;position:relative;background:#eef1f5}
.crop img{position:absolute;width:113.8%;left:-6.9%;top:-18.9%}
.wotd .wi{flex:1;min-width:180px}
.wotd .lab{font-weight:800;font-size:12px;letter-spacing:1.5px;color:var(--pencil-d);text-transform:uppercase}
.wotd .ww{font-family:Fredoka;font-weight:700;font-size:34px;line-height:1.1;margin:2px 0}
.wotd .wt{color:var(--muted);font-weight:700;font-size:16px}
.wotd .wx{font-size:15px;margin-top:6px;color:var(--ink)}
.wotd .wb{display:flex;gap:8px;align-items:center}

.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-h h2{font-family:Fredoka;font-weight:600;font-size:24px;margin:0}
.step{width:32px;height:32px;border-radius:50%;background:var(--chalk);color:#fff;font-family:Fredoka;font-weight:700;display:grid;place-items:center}

.units{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.unit{padding:0;overflow:hidden;border-radius:18px;position:relative}
.unit:hover{transform:translateY(-3px)}
.unit .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#eef1f5}
.unit .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}
.unit:hover .ph img{transform:scale(1.07)}
.unit .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.unit .badge{position:absolute;top:10px;left:10px;z-index:1;background:rgba(255,255,255,.94);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}
.unit .ic{position:absolute;right:12px;bottom:-20px;z-index:2;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.unit .body{padding:14px 14px 14px;position:relative}
.unit .n{font-family:Fredoka;font-weight:600;font-size:18px;margin:0;padding-right:46px}
.unit .c{font-size:13px;color:var(--muted);font-weight:700;margin-top:6px}
.unit .ph-wrap{position:relative}
.unit[aria-pressed="true"]{border-color:var(--chalk);box-shadow:0 0 0 3px var(--chalk),var(--shadow);background:#fff}
.unit[aria-pressed="true"] .badge{background:var(--chalk);color:#fff}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;height:100%;gap:2px;background:#fff}
.mosaic img{width:100%;height:100%;object-fit:cover}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:0 0 18px}
.mode{flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;text-align:left}
.mode:hover{transform:translateY(-2px)}
.mode .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--mc)}
.mode .mn{font-family:Fredoka;font-weight:600;font-size:17px}
.mode .md{font-weight:600;font-size:13px;color:var(--muted);line-height:1.3}
.mode[aria-pressed="true"]{background:#fff8e1;border-color:var(--pencil-d);box-shadow:0 0 0 3px var(--pencil),var(--shadow)}

/* ===== redesign fixes ===== */
h1,.word,.unit .n,.mode .mn,.sec-h h2,.wotd .ww,.opt,.res .score,.step{font-family:Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif}
.unit{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.unit .ic{bottom:auto;top:-24px}
.collage{height:430px}
.polar{width:43%}
.polar.p1{left:2%;top:0;transform:rotate(-6deg)}
.polar.p2{right:2%;top:5%;transform:rotate(5deg)}
.polar.p3{left:8%;bottom:0;top:auto;transform:rotate(4deg)}
.polar.p4{right:0;bottom:-2%;transform:rotate(-4deg)}
.modes{grid-template-columns:repeat(6,1fr)}
@media (min-width:900px){
  .units{grid-template-columns:repeat(4,1fr)}
  .unit[data-u="all"]{grid-column:span 2}
  .unit[data-u="all"] .ph{aspect-ratio:8/3;flex:none}
}
@media (max-width:899px){ .modes{grid-template-columns:repeat(3,1fr)} }
@media (max-width:600px){
  .units{grid-template-columns:repeat(2,1fr);gap:10px}
  .unit .n{font-size:15px;padding-right:0}
  .unit .body{padding:12px 10px}
  .unit .ic{width:36px;height:36px;font-size:18px;top:-20px;right:8px}
  .unit .badge{font-size:11px;padding:2px 8px;top:8px;left:8px}
  .unit[data-u="all"]{grid-column:span 2}
  .unit[data-u="all"] .ph{aspect-ratio:2/1}
  .unit[data-u="all"] .mosaic{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}
  .modes{grid-template-columns:repeat(2,1fr);gap:10px}
  .mode{padding:12px}
  .collage{height:420px}
  .wotd{padding:12px;gap:12px}
  .crop{width:96px;height:96px}
  .wotd .ww{font-size:28px}
}
.unit[data-u="all"] .mosaic{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}
</style>
</head>
<body>
<header class="hero">
  <div class="langsw" role="group" aria-label="Translation language">
    <button data-lang="fr" aria-pressed="true">FR</button>
    <button data-lang="ar" aria-pressed="false">AR</button>
    <button data-lang="off" aria-pressed="false">EN only</button>
  </div>
  <div class="hero-in">
    <div class="hero-txt">
      <div class="kit">✏️ English Word Kit</div>
      <h1>School <span>Life</span></h1>
      <p class="tag">Learn <b>60 school words</b> with real photos, sounds and fun games.</p>
      <div class="stats">
        <div class="pill" id="pStars">⭐ 0</div>
        <div class="pill" id="pKnown">✅ 0 / 60</div>
      </div>
      <div class="cta">
        <button class="btn y big" id="goLearn">▶ Start learning</button>
        <button class="btn line" id="goQuiz">🎯 Quick quiz</button>
      </div>
    </div>
    <div class="collage" id="collage" aria-hidden="true"></div>
  </div>
</header>

<main>
  <section class="wotd" id="wotd"></section>

  <div class="sec-h"><span class="step">1</span><h2>Choose a unit</h2></div>
  <div class="units" id="units"></div>

  <div class="sec-h"><span class="step">2</span><h2>Choose an activity</h2></div>
  <div class="modes" id="modes"></div>

  <section class="stage" id="stage" aria-live="polite"></section>
  <footer>Tip: tap 🔊 to hear every word · progress is saved on this device</footer>
</main>
<div class="toast" id="toast"></div>

<script>
const THUMBS={"classroom": "img/front/classroom.jpg", "playground": "img/front/playground.jpg", "lesson": "img/front/lesson.jpg", "pencil case": "img/front/pencil-case.jpg", "schoolbag": "img/front/schoolbag.jpg", "library": "img/front/library.jpg", "teacher": "img/front/teacher.jpg", "geography": "img/front/geography.jpg", "raise your hand": "img/front/raise-your-hand.jpg", "holidays": "img/front/holidays.jpg"};
const UNITS = [
  {id:"objects", name:"Classroom Objects", e:"🎒",img:"schoolbag"},
  {id:"places",  name:"School Places",     e:"🏫",img:"library"},
  {id:"people",  name:"People at School",  e:"👩‍🏫",img:"teacher"},
  {id:"subjects",name:"School Subjects",   e:"🧪",img:"geography"},
  {id:"actions", name:"Classroom Actions", e:"✋",img:"raise your hand"},
  {id:"day",     name:"The School Year",   e:"🗓️",img:"holidays"},
];

// w: word, fr, ar, e: emoji, x: example (must contain the word)
const WORDS = [
 // Classroom objects
 {u:"objects",w:"pencil",fr:"un crayon",ar:"قلم رصاص",e:"✏️",x:"I write my name with a pencil."},
 {u:"objects",w:"pen",fr:"un stylo",ar:"قلم حبر",e:"🖊️",x:"Can I borrow your blue pen, please?"},
 {u:"objects",w:"ruler",fr:"une règle",ar:"مسطرة",e:"📏",x:"Draw a straight line with your ruler."},
 {u:"objects",w:"notebook",fr:"un cahier",ar:"دفتر",e:"📓",x:"Open your notebook to a new page."},
 {u:"objects",w:"textbook",fr:"un manuel scolaire",ar:"كتاب مدرسي",e:"📕",x:"Our English textbook has twelve units."},

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>S.unit==="all"?WORDS:WORDS.filter(w=>w.u===S.unit);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function trHTML(w){ if(S.lang==="off")return ""; return S.lang==="ar"?`<span class="ar">${esc(w.ar)}</span>`:esc(w.fr); }
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}

let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text,rate=.9){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}
  catch(e){toast("Audio is not available on this device")}
}

function playWrong(){
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ wrongAudio=wrongAudio||new Audio(WRONG_SRC); wrongAudio.currentTime=0; const p=wrongAudio.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
}
let actx=null;
function beep(ok){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;o.type="sine";
    if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09)}else{o.frequency.setValueAtTime(220,t)}
    g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}
}

/* ---------- header / pickers ---------- */
function renderStats(){$("#pStars").textContent=`⭐ ${S.stars}`;$("#pKnown").textContent=`✅ ${S.known.size} / ${WORDS.length}`}
function renderUnits(){
  const all={id:"all",name:"All Units",e:"🌟"};
  $("#units").innerHTML=[all,...UNITS].map(u=>{
    const ws=u.id==="all"?WORDS:WORDS.filter(w=>w.u===u.id);
    const k=ws.filter(w=>S.known.has(w.id)).length;
    const ph=u.id==="all"
      ? `<div class="mosaic">${["schoolbag","teacher","geography","holidays"].map(t=>`<img loading="lazy" src="${THUMBS[t]}" alt="">`).join("")}</div>`
      : `<img loading="lazy" src="${THUMBS[u.img]}" alt="">`;
    return `<button class="unit" data-u="${u.id}" aria-pressed="${S.unit===u.id}">
      <div class="ph">${ph}<span class="badge">${S.unit===u.id?"✓ Selected":ws.length+" words"}</span></div>
      <div class="body"><span class="ic">${u.e}</span><div class="n">${u.name}</div>
      <div class="bar"><i style="width:${ws.length?k/ws.length*100:0}%"></i></div>
      <div class="c">${k} / ${ws.length} known</div></div></button>`}).join("");
}
function renderCollage(){
  const pics=[["classroom","p1"],["pencil case","p2"],["playground","p3"],["lesson","p4"]];
  $("#collage").innerHTML=pics.map(([w,c])=>`<div class="polar ${c}"><img src="${THUMBS[w]}" alt=""><span>${w}</span></div>`).join("");
}
function wordOfDay(){ const d=Math.floor(Date.now()/864e5); return WORDS[(d*7)%WORDS.length]; }
function renderWotd(){
  const w=wordOfDay();
  $("#wotd").innerHTML=`<div class="crop">${w.img?`<img src="${w.img}" alt="${esc(w.w)}">`:`<div style="font-size:64px;display:grid;place-items:center;height:100%">${w.e}</div>`}</div>
    <div class="wi"><div class="lab">⭐ Word of the day</div><div class="ww">${esc(w.w)}</div>
      ${S.lang!=="off"?`<div class="wt">${trHTML(w)}</div>`:""}<div class="wx">“${esc(w.x)}”</div></div>
    <div class="wb"><button class="spk" data-say="${esc(w.w)}" aria-label="Listen">🔊</button><button class="btn y" id="wotdGo">Practise it</button></div>`;
  $("#wotdGo").onclick=()=>{S.unit=w.u;S.mode="learn";renderUnits();renderModes();S.deck=pool();S.i=Math.max(0,S.deck.findIndex(x=>x.id===w.id));S.flipped=false;renderLearn();toStage()};
}
function toStage(){ const s=$("#stage"); try{s.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){s.scrollIntoView()} }
function renderModes(){
  $("#modes").innerHTML=MODES.map(m=>`<button class="mode" data-m="${m.id}" aria-pressed="${S.mode===m.id}">
    <span class="mi" style="--mc:${m.c}">${m.e}</span><span class="mn">${m.name}</span><span class="md">${m.d}</span></button>`).join("");
}
document.addEventListener("click",e=>{
  const u=e.target.closest("[data-u]"); if(u){S.unit=u.dataset.u;renderUnits();start();return}
  const m=e.target.closest("[data-m]"); if(m){S.mode=m.dataset.m;renderModes();start();toStage();return}
  const l=e.target.closest("[data-lang]"); if(l){S.lang=l.dataset.lang;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b===l));save();refresh();renderWotd();return}
  const s=e.target.closest("[data-say]"); if(s){e.stopPropagation();say(s.dataset.say);return}
});
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));

function start(){
  if(S.mode==="learn"){S.deck=pool();S.i=0;S.flipped=false;renderLearn()}
  else if(S.mode==="list"){renderList()}
  else newRound();
}
function refresh(){ // re-render current view without resetting progress
  if(S.mode==="learn")renderLearn(); else if(S.mode==="list")renderList(); else if(S.round&&!S.round.done)renderQ(); }

/* ---------- Flashcards ---------- */
function renderLearn(){
  const w=S.deck[S.i]; const known=S.known.has(w.id);
  const ex=esc(w.x).replace(new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),m=>`<b>${m}</b>`);
  $("#stage").innerHTML=`
    <div class="top-row"><span class="counter">Card ${S.i+1} of ${S.deck.length}</span>
      <button class="ghost" id="shuf">🔀 Shuffle</button></div>
    <div class="flip"><div class="card ${S.flipped?"flipped":""}" id="card" role="button" tabindex="0" aria-label="Flip card">
      <div class="face front"><div class="big-e">${pic(w,"lg")}</div><div class="word">${esc(w.w)}</div>
        <div style="margin-top:12px"><button class="spk" data-say="${esc(w.w)}" aria-label="Listen">🔊</button></div>
        <div class="tap">Tap the card to see the meaning</div></div>
      <div class="face back">${S.lang!=="off"?`<div class="tr">${trHTML(w)}</div>`:`<div class="tr">${esc(w.w)}</div>`}
        <div class="ex">“${ex}”</div>
        <div style="margin-top:14px"><button class="spk" data-say="${esc(w.x)}" aria-label="Listen to the sentence">🔊</button></div>
        <div class="tap">Tap to flip back</div></div>
    </div></div>
    <div class="fc-ctrl">
      <button class="btn" id="prev" aria-label="Previous">◀</button>
      <button class="btn ${known?"known":"y"}" id="know">${known?"✅ I know it":"☐ I know it"}</button>
      <button class="btn" id="next" aria-label="Next">▶</button>
    </div>`;
  const card=$("#card"); const flip=()=>{S.flipped=!S.flipped;card.classList.toggle("flipped",S.flipped)};
  card.onclick=flip; card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  $("#prev").onclick=()=>{S.i=(S.i-1+S.deck.length)%S.deck.length;S.flipped=false;renderLearn()};
  $("#next").onclick=()=>{S.i=(S.i+1)%S.deck.length;S.flipped=false;renderLearn()};
  $("#shuf").onclick=()=>{S.deck=shuffle(S.deck);S.i=0;S.flipped=false;renderLearn();toast("Cards shuffled")};
  $("#know").onclick=()=>{known?S.known.delete(w.id):S.known.add(w.id);save();renderStats();renderUnits();renderLearn()};
}
document.addEventListener("keydown",e=>{
  if(S.mode!=="learn"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")$("#next")?.click(); if(e.key==="ArrowLeft")$("#prev")?.click();
});

/* ---------- Word list ---------- */
function renderList(){
  $("#stage").innerHTML=`<div class="top-row"><span class="counter">${pool().length} words</span></div>
  <div class="list">${pool().map(w=>`<div class="li ${S.known.has(w.id)?"k":""}"><div class="e">${pic(w,"sm")}</div>
    <div><div class="w">${esc(w.w)}</div>${S.lang!=="off"?`<div class="t">${trHTML(w)}</div>`:""}</div>
    <button class="spk" data-say="${esc(w.w)}" aria-label="Listen to ${esc(w.w)}">🔊</button></div>`).join("")}</div>`;
}

/* ---------- Games ---------- */
const ROUND=10;
function distractors(w,n=3){
  const same=shuffle(WORDS.filter(x=>x.u===w.u&&x.id!==w.id));
  const other=shuffle(WORDS.filter(x=>x.u!==w.u));
  return [...same,...other].slice(0,n);
}
function newRound(){
  const p=shuffle(pool()).slice(0,ROUND);
  S.round={qs:p.map(w=>({w,opts:shuffle([w,...distractors(w)])})),i:0,score:0,missed:[],answered:false,done:false,hints:0};
  renderQ(true);
}
function renderQ(autoSpeak){
  const R=S.round,q=R.qs[R.i],w=q.w;
  let prompt="",body="";
  const head=`<div class="top-row"><span class="counter">Question ${R.i+1} of ${R.qs.length}</span><span class="counter">Score: ${R.score}</span></div>
    <div class="progress"><i style="width:${R.i/R.qs.length*100}%"></i></div>`;
  const optsHTML=`<div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o.id}">${esc(o.w)}</button>`).join("")}</div>`;
  if(S.mode==="quiz"){
    prompt=`<div class="big-e">${pic(w,"lg")}</div><div class="hint">${S.lang!=="off"?trHTML(w):"What is this in English?"}</div>`;body=optsHTML;
  }else if(S.mode==="listen"){
    prompt=`<button class="spk big" data-say="${esc(w.w)}" aria-label="Play the word">🔊</button><div class="hint">Listen, then choose the word you hear</div>`;body=optsHTML;
  }else if(S.mode==="fill"){
    const re=new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
    prompt=`<div class="sentence">${esc(w.x).replace(re,'<span class="gap">&nbsp;?&nbsp;</span>')}</div><div class="hint">Choose the missing word</div>`;body=optsHTML;
  }else if(S.mode==="spell"){
    prompt=`<div class="big-e">${pic(w,"lg")}</div><div class="hint">${S.lang!=="off"?trHTML(w)+" · ":""}${w.w.length} letters${w.w.includes(" ")?" (with a space)":""}</div>
      <div style="margin-top:10px"><button class="spk" data-say="${esc(w.w)}" aria-label="Listen">🔊</button></div>`;
    body=`<form class="spell" id="sf" autocomplete="off"><input id="si" aria-label="Type the word" placeholder="Type the word…" autocapitalize="off" spellcheck="false">
      <button class="btn y" type="submit">Check</button><button class="ghost" type="button" id="hint">💡 Hint</button></form>`;
  }
  $("#stage").innerHTML=`${head}<div class="prompt">${prompt}</div>${body}<div class="fb" id="fb"></div><div class="next-row" id="nr"></div>`;
  R.answered=false; R.hintLvl=0; R.wrong=0;
  if(S.mode==="spell"){
    const si=$("#si"); si.focus();
    si.oninput=()=>si.classList.remove("bad","shake");
    $("#sf").onsubmit=e=>{e.preventDefault(); if(R.answered)return; const v=si.value; if(!v.trim())return; answer(norm(v)===norm(w.w),si)};
    $("#hint").onclick=()=>{ if(R.answered)return; R.hintLvl=Math.min(w.w.length,R.hintLvl+1); si.value=w.w.slice(0,R.hintLvl); si.focus(); R.usedHint=true;};
    R.usedHint=false;
  }else{
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(R.answered||b.disabled)return; answer(+b.dataset.o===w.id,b)});
  }
  if(autoSpeak!==false && S.mode==="listen") setTimeout(()=>say(w.w),250);
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const pick=a=>a[Math.floor(Math.random()*a.length)];
function answer(ok,el){
  const R=S.round,w=R.qs[R.i].w;
  const fb=$("#fb");
  if(!ok){ // wrong: never reveal the answer — let the student try again
    R.wrong++; if(R.wrong===1) R.missed.push(w);
    playWrong();
    fb.className="fb bad";
    fb.textContent=pick(["Try again! 💪","Not quite — try again!","Oops! Have another go.","Almost… try again!"]);
    if(S.mode==="spell"){ el.classList.remove("bad","shake"); void el.offsetWidth; el.classList.add("bad","shake"); el.select(); }
    else { el.classList.add("bad"); el.disabled=true; }
    return;
  }
  R.answered=true;
  const first=R.wrong===0;
  if(S.mode==="spell"){
    el.classList.remove("bad","shake"); el.classList.add("ok"); el.disabled=true;
    if(first&&R.usedHint){fb.textContent="Correct — with a hint (half point) 👍";R.score+=.5}
    else if(first){fb.textContent="Perfect spelling! 🎉";R.score++}
    else fb.textContent="Yes! You got it! 👍";
  }else{
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true); el.classList.add("ok");
    fb.textContent=first?pick(["Great! 🎉","Well done! ⭐","Excellent! 👏","Correct! ✅"]):"Yes! You found it! 👍";
    if(first)R.score++;
  }
  fb.className="fb ok";
  beep(true); say(w.w);
  const last=R.i===R.qs.length-1;
  $("#nr").innerHTML=`<button class="btn" id="nx">${last?"See results":"Next ▶"}</button>`;
  $("#nx").onclick=()=>{ if(last)results(); else {R.i++;renderQ()} };
  $("#nx").focus();
}
function results(){
  const R=S.round; R.done=true;
  const pct=R.score/R.qs.length; const st=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  S.stars+=st;
  if(pct===1) R.qs.forEach(q=>S.known.add(q.w.id)); // perfect round marks words as known
  save(); renderStats(); renderUnits();
  const msg=st===3?"Brilliant work!":st===2?"Good job — keep practising!":st===1?"Nice try — review and play again.":"Let's review these words with the flashcards.";
  $("#stage").innerHTML=`<div class="res">
    <div class="stars" aria-label="${st} stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
    <div class="score">${+R.score.toFixed(1)} / ${R.qs.length}</div>
    <p style="font-weight:800;font-size:18px">${msg}</p>
    ${pct===1?`<p style="color:var(--ok);font-weight:700">All ${R.qs.length} words marked as known ✅</p>`:""}
    ${R.missed.length?`<div class="sec-t">Words that needed another try</div><div class="missed">${R.missed.map(w=>`<span class="chip">${pic(w,"xs")} ${esc(w.w)}</span>`).join("")}</div>`:""}
    <div class="fc-ctrl"><button class="btn y" id="again">🔁 Play again</button>${R.missed.length?`<button class="btn" id="rev">🃏 Review missed words</button>`:""}</div>
  </div>`;
  $("#again").onclick=newRound;
  const rv=$("#rev"); if(rv) rv.onclick=()=>{S.mode="learn";renderModes();S.deck=[...R.missed];S.i=0;S.flipped=false;renderLearn()};
}

renderStats();renderUnits();renderModes();renderCollage();renderWotd();start();
$("#goLearn").onclick=()=>{S.mode="learn";renderModes();start();toStage()};
$("#goQuiz").onclick=()=>{S.unit="all";S.mode="quiz";renderUnits();renderModes();start();toStage()};
</script>
</body>
